services:
  postgres:
    image: postgres:17-alpine
    container_name: vt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vehicle_tracker
      POSTGRES_PASSWORD: vehicle_tracker
      POSTGRES_DB: vehicle_tracker
    ports:
      # 5432 on the host is already taken by another Postgres.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle_tracker -d vehicle_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vt-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data: